<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>micr.fun — Каталог микроприложений</title>
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121212;
  --bg-elevated: rgba(255,255,255,0.03);
  --bg-hover: rgba(255,255,255,0.06);
  --text-primary: #ffffff;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --accent: #3b82f6;
  --accent-teal: #2dd4bf;
  --radius: 14px;
  --transition: all 0.2s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body {
  background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59,130,246,0.08) 0%, transparent 50%),
              radial-gradient(ellipse 60% 40% at 80% 100%, rgba(45,212,191,0.05) 0%, transparent 50%),
              var(--bg);
  min-height: 100vh;
}

::selection { background: var(--accent); color: #fff; }

/* Header */
.header {
  padding: 24px clamp(16px, 5vw, 48px);
  max-width: 1200px;
  margin: 0 auto;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-link { display: flex; align-items: center; text-decoration: none; }
.logo-link:hover { opacity: 0.85; }

/* Catalog mascot */
.mascot {
  width: 72px;
  height: 52px;
  padding: 0;
  border: 1px solid rgba(45,212,191,0.2);
  border-radius: 18px;
  background: linear-gradient(145deg, rgba(45,212,191,0.12), rgba(59,130,246,0.08));
  color: var(--accent-teal);
  cursor: pointer;
  display: block;
  flex: 0 0 auto;
  transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
}

.mascot:hover,
.mascot:focus-visible {
  border-color: rgba(45,212,191,0.55);
  background: linear-gradient(145deg, rgba(45,212,191,0.2), rgba(59,130,246,0.12));
  transform: translateY(-1px);
}

.mascot:focus-visible {
  outline: 2px solid var(--accent-teal);
  outline-offset: 3px;
}

.mascot svg { width: 100%; height: 100%; display: block; overflow: visible; }
.mascot-pupil { transition: transform 0.16s ease-out; transform-box: fill-box; transform-origin: center; }
.mascot-eye { transition: transform 0.12s ease; transform-box: fill-box; transform-origin: center; }
.mascot-mouth { transition: d 0.18s ease; }
.mascot:hover .mascot-eye,
.mascot:focus-visible .mascot-eye,
.mascot.is-happy .mascot-eye { transform: scaleY(0.72); }
.mascot:hover .mascot-mouth,
.mascot:focus-visible .mascot-mouth,
.mascot.is-happy .mascot-mouth { d: path('M 40 48 Q 48 56 56 48'); }
.mascot.is-blinking .mascot-eye { transform: scaleY(0.1); }

@keyframes mascotGlow {
  50% { filter: drop-shadow(0 0 5px rgba(45,212,191,0.24)); }
}

.mascot { animation: mascotGlow 4.2s ease-in-out infinite; }

/* Controls */
.controls {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-wrap {
  position: relative;
}

.search-wrap input {
  width: 220px;
  padding: 10px 14px 10px 38px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14px;
  transition: var(--transition);
  outline: none;
}

.search-wrap input::placeholder { color: var(--text-muted); }
.search-wrap input:focus { border-color: var(--accent); background: var(--bg-hover); }

#search:focus-visible,
.filter-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.search-wrap svg {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  width: 18px; height: 18px;
  color: var(--text-muted);
  pointer-events: none;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.filter-btn {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--btn-color, var(--border));
  border-radius: 999px;
  color: var(--btn-color, var(--text-secondary));
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}

.filter-btn:hover {
  background: var(--btn-color, var(--accent));
  border-color: var(--btn-color, var(--accent));
  color: #fff;
}

.filter-btn.active {
  background: var(--btn-color, var(--accent));
  border-color: var(--btn-color, var(--accent));
  color: #fff;
  box-shadow: 0 0 12px color-mix(in srgb, var(--btn-color, var(--accent)) 40%, transparent);
}

/* Lang switch */
.lang-switch {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px;
  flex: 0 0 auto;
}

.lang-btn {
  padding: 4px 10px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: 999px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.lang-btn:hover {
  color: var(--text-primary);
}

.lang-btn.active {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text-primary);
}

.lang-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* Grid */
.main {
  padding: 32px clamp(16px, 5vw, 48px) 64px;
  max-width: 1200px;
  margin: 0 auto;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

/* Card */
.app-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.app-card:hover {
  border-color: var(--border-hover);
  background: var(--bg-hover);
}

.app-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.card-preview {
  height: 160px;
  overflow: hidden;
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.card-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
}

.missing-preview {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
}

.card-badge-overlay {
  position: absolute;
  top: 8px; right: 8px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  backdrop-filter: blur(4px);
}

.card-title-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 10px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  font-size: 15px;
  font-weight: 600;
  color: #fff;
}

.card-desc {
  padding: 8px 12px 0;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Hidden card (filtered out) */
.app-card.hidden { display: none; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
  font-size: 15px;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active { display: flex; }

.modal {
  width: 100%;
  max-width: 1100px;
  height: 90vh;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalIn 0.2s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 52px;
  gap: 12px;
}

.modal-info { display: flex; align-items: center; gap: 10px; min-width: 0; }

.modal-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.modal-badge {
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  flex-shrink: 0;
}

.modal-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.modal-btn {
  padding: 6px 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap;
}

.modal-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }

.modal-btn svg, .modal-btn .icon { width: 14px; height: 14px; }

.modal-iframe-wrap { flex: 1; position: relative; background: var(--bg); }
.modal-iframe-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

.modal-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 10px;
  color: var(--text-muted);
  font-size: 13px;
}

.modal-loading .spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.footer {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  max-width: 1200px;
  margin: 0 auto;
}

/* Mobile */
@media (max-width: 640px) {
  .header {
    padding: 16px 16px 8px;
  }

  .header-top {
    display: block;
    margin-bottom: 0;
  }

  .header-left {
    min-height: 24px;
    margin-bottom: 14px;
  }

  .mascot { width: 64px; height: 48px; }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }

  .search-wrap,
  .search-wrap input {
    width: 100%;
  }

  .filters {
    width: calc(100vw - 32px);
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 8px;
    padding: 2px 0 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .filters::-webkit-scrollbar {
    display: none;
  }

  .filter-btn {
    flex: 0 0 auto;
    min-height: 44px;
    padding: 9px 15px;
  }

  .main {
    padding: 12px 16px 48px;
  }

  .app-grid {
    grid-template-columns: 1fr;
    gap: 24px;
  }

  .app-card {
    min-width: 0;
  }

  .card-preview {
    height: auto;
    aspect-ratio: 16 / 10;
  }

  .card-title-overlay {
    padding: 28px 16px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,0.82));
    font-size: 17px;
  }

  .card-desc {
    padding: 12px 16px 16px;
    font-size: 14px;
    line-height: 1.55;
  }

  .modal { height: 100vh; border-radius: 0; }
  .modal-overlay { padding: 0; }
  .modal-title { font-size: 13px; }
  .modal-btn span { display: none; }
  .modal-btn { padding: 6px; }
}

@media (max-width: 480px) {
  .header { padding: 16px; }
  .main { padding: 0 16px 40px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }

  .mascot { animation: none; }
  .mascot-pupil, .mascot-eye, .mascot-mouth { transition: none; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="header-left">
      <a href="/" class="logo-link">
        <img src="/logo-sm.png" alt="micr.fun" height="16" style="display:block">
      </a>
      <button class="mascot" id="mascot" type="button" aria-label="Маскот micr.fun" title="Привет!">
        <svg viewBox="0 0 96 72" aria-hidden="true" focusable="false">
          <path d="M 18 37 Q 17 18 34 14 Q 48 5 62 14 Q 79 18 78 37 Q 77 59 48 61 Q 19 59 18 37Z" fill="#171f25" stroke="currentColor" stroke-width="2"/>
          <path d="M 24 25 Q 29 16 38 16" fill="none" stroke="#2dd4bf" stroke-linecap="round" stroke-width="2" opacity=".7"/>
          <ellipse class="mascot-eye" cx="35" cy="32" rx="8" ry="7" fill="#f8fafc"/>
          <ellipse class="mascot-eye" cx="61" cy="32" rx="8" ry="7" fill="#f8fafc"/>
          <circle class="mascot-pupil" data-mascot-pupil cx="35" cy="32" r="3" fill="#121212"/>
          <circle class="mascot-pupil" data-mascot-pupil cx="61" cy="32" r="3" fill="#121212"/>
          <path class="mascot-mouth" d="M 40 49 Q 48 45 56 49" fill="none" stroke="#f8fafc" stroke-linecap="round" stroke-width="2"/>
          <circle cx="25" cy="44" r="2" fill="#ef5b73" opacity=".65"/>
          <circle cx="71" cy="44" r="2" fill="#ef5b73" opacity=".65"/>
        </svg>
      </button>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="Найти приложение..." autocomplete="off">
      </div>
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="games">Игры</button>
        <button class="filter-btn" data-filter="tools">Инструменты</button>
        <button class="filter-btn" data-filter="experiments">Эксперименты</button>
        <button class="filter-btn" data-filter="knowledge">Знания</button>
      </div>
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Выбор языка">
        <button type="button" class="lang-btn active" data-lang="ru">RU</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="app-grid" id="appGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">Ничего не найдено</div>
</main>

<footer class="footer">
  micr.fun · 2026
</footer>

<script src="/assets/js/mascot.js"></script>
<script src="/js/catalog.js"></script>
<script>
const FILTER_COLORS = {
  all: '#3b82f6',
  games: '#f59e0b',
  tools: '#2dd4bf',
  experiments: '#a78bfa',
  knowledge: '#34d399'
};

const grid = document.getElementById('appGrid');
const empty = document.getElementById('emptyState');
const search = document.getElementById('search');
const filterBtns = document.querySelectorAll('.filter-btn');
const langBtns = document.querySelectorAll('.lang-btn');

let APPS = [];
let activeFilter = 'all';
let activeQuery = '';
let currentLang = window.MicrCatalog ? window.MicrCatalog.getLang() : 'ru';

function updateTexts(lang) {
  if (!window.MicrCatalog) return;
  document.title = window.MicrCatalog.t('docTitle', lang);
  if (search) search.placeholder = window.MicrCatalog.t('searchPlaceholder', lang);
  filterBtns.forEach(btn => {
    const f = btn.dataset.filter;
    btn.textContent = window.MicrCatalog.getCategoryLabel(f, lang);
  });
  if (empty) empty.textContent = window.MicrCatalog.t('emptyState', lang);
  langBtns.forEach(btn => {
    const isActive = btn.dataset.lang === lang;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
  });
  if (typeof window.updateMascotLang === 'function') {
    window.updateMascotLang(lang);
  }
}

function paintFilters() {
  filterBtns.forEach(btn => {
    btn.style.setProperty('--btn-color', FILTER_COLORS[btn.dataset.filter] || '#3b82f6');
  });
}

function render() {
  if (!window.MicrCatalog) return;
  window.MicrCatalog.render({
    apps: APPS,
    gridEl: grid,
    emptyEl: empty,
    filter: activeFilter,
    query: activeQuery,
    lang: currentLang
  });
}

function setLanguage(lang) {
  if (!window.MicrCatalog) return;
  currentLang = window.MicrCatalog.setLang(lang);
  updateTexts(currentLang);
  render();
}

langBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    setLanguage(btn.dataset.lang);
  });
});

search.addEventListener('input', (e) => {
  activeQuery = e.target.value;
  render();
});

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

async function init() {
  updateTexts(currentLang);
  paintFilters();
  try {
    APPS = await window.MicrCatalog.load();
  } catch (err) {
    console.error('Failed to load graph.json:', err);
    if (empty) {
      empty.textContent = window.MicrCatalog ? window.MicrCatalog.t('loadError', currentLang) : 'Не удалось загрузить каталог';
      empty.style.display = 'block';
    }
    return;
  }
  render();
}

init();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>

</body>
</html>
