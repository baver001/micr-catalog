<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-doc="hub.doc_title">micr.fun — Каталог микроприложений</title>
<script>
(function () {
  var theme = localStorage.getItem('micrfun_theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
})();
</script>
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/data/styles/mascot.css">
<link rel="stylesheet" href="/data/styles/hub-settings.css">
<style>
:root,
html[data-theme="dark"] {
  --bg: #121212;
  --bg-elevated: rgba(255,255,255,0.03);
  --bg-hover: rgba(255,255,255,0.06);
  --text-primary: #ffffff;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --accent: #3b82f6;
  --accent-teal: #2dd4bf;
  --radius: 14px;
  --transition: all 0.2s ease;
  --body-glow-a: rgba(59,130,246,0.08);
  --body-glow-b: rgba(45,212,191,0.05);
  --settings-panel-bg: #1a1a1e;
  --settings-shadow: 0 12px 40px rgba(0,0,0,0.45);
  --micr-chrome-size: 32px;
  --micr-chrome-rx: 10.182px;
}

html[data-theme="light"] {
  --bg: #f3f3f4;
  --bg-elevated: rgba(0,0,0,0.03);
  --bg-hover: rgba(0,0,0,0.05);
  --text-primary: #111827;
  --text-secondary: #4b5563;
  --text-muted: #6b7280;
  --border: rgba(0,0,0,0.08);
  --border-hover: rgba(0,0,0,0.14);
  --accent: #2563eb;
  --body-glow-a: rgba(37,99,235,0.06);
  --body-glow-b: rgba(13,148,136,0.05);
  --settings-panel-bg: #ffffff;
  --settings-shadow: 0 12px 40px rgba(15,23,42,0.12);
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body {
  background: radial-gradient(ellipse 80% 50% at 50% -10%, var(--body-glow-a) 0%, transparent 50%),
              radial-gradient(ellipse 60% 40% at 80% 100%, var(--body-glow-b) 0%, transparent 50%),
              var(--bg);
  min-height: 100vh;
}

::selection { background: var(--accent); color: #fff; }

/* Header */
.header {
  padding: 24px clamp(16px, 5vw, 48px);
  max-width: 1200px;
  margin: 0 auto;
}

.header-bar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.header-mascot {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  line-height: 0;
}

.header-mascot:hover { opacity: 0.9; }

.header-logo {
  grid-column: 2;
  justify-self: center;
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

.header-logo:hover { opacity: 0.92; }

.header-logo .logo-wordmark {
  height: 22px;
  width: auto;
  display: block;
}

.header-settings {
  justify-self: end;
  grid-column: 3;
  position: relative;
}

.settings-btn {
  width: var(--micr-chrome-size);
  height: var(--micr-chrome-size);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: var(--micr-chrome-rx);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  flex-shrink: 0;
}

.settings-btn:hover {
  color: var(--text-primary);
  background: var(--bg-hover);
}

.settings-btn svg {
  width: 18px;
  height: 18px;
}

.settings-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 240px;
  padding: 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--settings-panel-bg);
  box-shadow: var(--settings-shadow);
  z-index: 40;
}

.settings-panel[hidden] { display: none; }

/* Controls — mobile-first: scrolling filters + compact search */
.catalog-toolbar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  min-height: 44px;
}

.catalog-toolbar__filters {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 2px 4px 2px 0;
  mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
}

.catalog-toolbar__filters::-webkit-scrollbar {
  display: none;
}

.catalog-toolbar__search {
  flex-shrink: 0;
  position: relative;
  z-index: 3;
  width: 40px;
  height: 40px;
}

.search-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-elevated);
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}

.search-toggle:hover,
.search-toggle[aria-expanded="true"] {
  color: var(--text-primary);
  border-color: var(--border-hover);
  background: var(--bg-hover);
}

.search-toggle {
  position: absolute;
  right: 0;
  top: 0;
  z-index: 4;
}

.search-field {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  left: auto;
  width: 0;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
  display: flex;
  align-items: center;
  transition: opacity 0.18s ease;
  z-index: 2;
}

.catalog-toolbar.is-search-open .search-field {
  left: 0;
  right: 0;
  width: auto;
  opacity: 1;
  pointer-events: auto;
  padding: 0 48px 0 8px;
  background: var(--bg);
  border-radius: 12px;
  box-shadow: 0 0 0 1px var(--border);
}

.catalog-toolbar.is-search-open .catalog-toolbar__filters {
  visibility: hidden;
  pointer-events: none;
}

.search-field input {
  flex: 1;
  min-width: 0;
  padding: 9px 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14px;
  outline: none;
}

.search-field:not(.is-open) input {
  width: 0;
  padding: 0;
  border: none;
}

.catalog-toolbar.is-search-open .search-field input {
  width: 100%;
}

.search-field input:focus {
  border-color: var(--accent);
}

#search:focus-visible,
.filter-btn:focus-visible,
.settings-btn:focus-visible,
.search-toggle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.search-toggle svg {
  width: 18px;
  height: 18px;
}

.catalog-toolbar.is-search-open .search-toggle {
  background: var(--bg-elevated);
}

.filter-btn {
  flex-shrink: 0;
  scroll-snap-align: start;
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--btn-color, var(--border));
  border-radius: 999px;
  color: var(--btn-color, var(--text-secondary));
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}

.filter-btn:hover {
  background: var(--btn-color, var(--accent));
  border-color: var(--btn-color, var(--accent));
  color: #fff;
}

.filter-btn.active {
  background: var(--btn-color, var(--accent));
  border-color: var(--btn-color, var(--accent));
  color: #fff;
}

/* Grid */
.main {
  padding: 32px clamp(16px, 5vw, 48px) 64px;
  max-width: 1200px;
  margin: 0 auto;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

/* Card */
.app-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color: var(--text-primary);
  text-decoration: none;
}

.app-card,
.app-card:hover,
.app-card:visited,
.app-card * { text-decoration: none; }

.app-card:hover {
  border-color: var(--border-hover);
  background: var(--bg-hover);
}

.app-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.card-preview {
  aspect-ratio: 16 / 9;
  height: auto;
  overflow: hidden;
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.card-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
}

.card-art {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 42%), linear-gradient(135deg, rgba(255,255,255,.035), rgba(255,255,255,.01));
}
.card-art::before,
.card-art::after { content: ''; position: absolute; border: 1px solid rgba(255,255,255,.08); border-radius: 50%; }
.card-art::before { width: 46%; aspect-ratio: 1; }
.card-art::after { width: 70%; aspect-ratio: 1; opacity: .45; }
.card-art-glyph { position: relative; z-index: 1; font-size: clamp(34px, 5vw, 58px); filter: drop-shadow(0 10px 24px rgba(0,0,0,.28)); }
.card-art-line { position: absolute; width: 32%; height: 1px; bottom: 18%; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .7; }

.missing-preview {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
}

.card-content { padding: 15px 16px 17px; }
.card-content h3 {
  margin: 0;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 17px;
  font-weight: 650;
  line-height: 1.25;
  letter-spacing: -0.025em;
}
.card-category {
  position: absolute;
  top: 12px;
  left: 12px;
  padding: 3px 8px;
  border: 1px solid currentColor;
  border-radius: 999px;
  background: rgba(8,10,14,.72);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.card-desc {
  margin: 7px 0 0;
  padding: 0;
  font-family: inherit;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  letter-spacing: -0.005em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Hidden card (filtered out) */
.app-card.hidden { display: none; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
  font-size: 15px;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active { display: flex; }

.modal {
  width: 100%;
  max-width: 1100px;
  height: 90vh;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalIn 0.2s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 52px;
  gap: 12px;
}

.modal-info { display: flex; align-items: center; gap: 10px; min-width: 0; }

.modal-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.modal-badge {
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  flex-shrink: 0;
}

.modal-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.modal-btn {
  padding: 6px 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap;
}

.modal-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }

.modal-btn svg, .modal-btn .icon { width: 14px; height: 14px; }

.modal-iframe-wrap { flex: 1; position: relative; background: var(--bg); }
.modal-iframe-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

.modal-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 10px;
  color: var(--text-muted);
  font-size: 13px;
}

.modal-loading .spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.footer {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  max-width: 1200px;
  margin: 0 auto;
}

/* Mobile */
@media (max-width: 640px) {
  .header {
    padding: 16px 16px 8px;
  }

  .header-bar {
    margin-bottom: 14px;
  }

  .header-logo .logo-wordmark {
    height: 20px;
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }

  .search-wrap,
  .search-wrap input {
    width: 100%;
  }

  .filters {
    width: calc(100vw - 32px);
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 8px;
    padding: 2px 0 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .filters::-webkit-scrollbar {
    display: none;
  }

  .filter-btn {
    flex: 0 0 auto;
    min-height: 44px;
    padding: 9px 15px;
  }

  .main {
    padding: 12px 16px 48px;
  }

  .app-grid {
    grid-template-columns: 1fr;
    gap: 24px;
  }

  .app-card {
    min-width: 0;
  }

  .card-preview {
    height: auto;
    aspect-ratio: 16 / 9;
  }

  .card-content { padding: 12px 12px 14px; }
  .card-desc {
    padding: 0;
    font-size: 14px;
    line-height: 1.55;
  }

  .modal { height: 100vh; border-radius: 0; }
  .modal-overlay { padding: 0; }
  .modal-title { font-size: 13px; }
  .modal-btn span { display: none; }
  .modal-btn { padding: 6px; }
}

@media (max-width: 900px) {
  .search-wrap input {
    width: min(280px, 100%);
  }
}

@media (max-width: 480px) {
  .header { padding: 16px; }
  .main { padding: 0 16px 40px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-bar">
    <button type="button" class="header-mascot" id="hubMascotNav" aria-expanded="false" data-i18n-aria="nav.open">
      <span data-micr-mascot data-size="sm"></span>
    </button>
    <a href="/" class="header-logo" id="logoLink">
      <img class="logo-wordmark" src="/logo-sm.png" alt="micr.fun" height="22" decoding="async">
    </a>
    <div class="header-settings">
      <button type="button" class="settings-btn" id="settingsBtn" aria-expanded="false" data-i18n-aria="settings.open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="9" x2="20" y2="9"/>
          <circle cx="15" cy="9" r="2" fill="currentColor" stroke="none"/>
          <line x1="4" y1="15" x2="20" y2="15"/>
          <circle cx="9" cy="15" r="2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <div class="settings-panel" id="settingsPanel" hidden>
        <div class="settings-field">
          <span class="settings-label" data-i18n="ui.language">Language</span>
          <div class="lang-picker" id="langPicker">
            <button type="button" class="lang-picker__trigger" id="langPickerTrigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="lang-picker__value" id="langPickerValue">English</span>
              <svg class="lang-picker__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <ul class="lang-picker__menu" id="langPickerMenu" role="listbox" hidden></ul>
          </div>
        </div>
        <div class="settings-field settings-field--row">
          <span class="settings-label" data-i18n="settings.theme">Theme</span>
          <button type="button" class="theme-toggle" id="themeToggle" role="switch" aria-checked="false">
            <span class="theme-toggle__track" aria-hidden="true"></span>
            <span class="theme-toggle__thumb">
              <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 6.5 6.5 0 0 0 21 14.5z"/></svg>
              <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="catalog-toolbar" id="catalogToolbar">
    <div class="catalog-toolbar__filters" id="filters">
      <button class="filter-btn active" type="button" data-filter="all" data-i18n="categories.all">Все</button>
      <button class="filter-btn" type="button" data-filter="games" data-i18n="categories.games">Игры</button>
      <button class="filter-btn" type="button" data-filter="experiments" data-i18n="categories.experiments">Эксперименты</button>
      <button class="filter-btn" type="button" data-filter="tools" data-i18n="categories.tools">Инструменты</button>
      <button class="filter-btn" type="button" data-filter="knowledge" data-i18n="categories.knowledge">Знания</button>
    </div>
    <div class="catalog-toolbar__search">
      <div class="search-field" id="searchField">
        <input type="search" id="search" data-i18n-placeholder="hub.search_placeholder" placeholder="Найти…" autocomplete="off" enterkeyhint="search">
      </div>
      <button type="button" class="search-toggle" id="searchToggle" aria-expanded="false" aria-controls="search" data-i18n-aria="hub.search_open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="main">
  <div class="app-grid" id="appGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none" data-i18n="hub.empty">Ничего не найдено</div>
</main>

<footer class="footer">
  micr.fun · 2026
</footer>

<script src="/data/js/i18n-core.js"></script>
<script src="/data/js/mascot.js"></script>
<script src="/data/js/hub-settings.js"></script>
<script src="/data/js/pwa-install.js"></script>
<script>
// Registry-driven catalog renderer lives in data/js/catalog-hub.js.

if (false) {
const FILTER_COLORS = {
  all: '#3b82f6',
  games: '#f59e0b',
  experiments: '#ef5b73',
  tools: '#3b82f6',
  knowledge: '#2da87a'
};

function appText(id, field) {
  if (window.micrfun && typeof window.micrfun.t === 'function') {
    return window.micrfun.t('apps.' + id + '.' + field);
  }
  return id;
}

function categoryLabel(cat) {
  if (window.micrfun && typeof window.micrfun.t === 'function') {
    return window.micrfun.t('categories.' + cat);
  }
  return cat;
}
const grid = document.getElementById('appGrid');
const empty = document.getElementById('emptyState');
const search = document.getElementById('search');
const searchToggle = document.getElementById('searchToggle');
const searchField = document.getElementById('searchField');
const catalogToolbar = document.getElementById('catalogToolbar');
const filterBtns = document.querySelectorAll('.filter-btn');

function setSearchOpen(open) {
  if (!searchField || !searchToggle) return;
  searchField.classList.toggle('is-open', open);
  if (catalogToolbar) catalogToolbar.classList.toggle('is-search-open', open);
  searchToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open && search) search.focus();
  if (!open && search) {
    search.value = '';
    activeQuery = '';
    render();
  }
}

if (searchToggle && searchField) {
  searchToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    setSearchOpen(!catalogToolbar.classList.contains('is-search-open'));
  });
  document.addEventListener('click', (e) => {
    if (!catalogToolbar.classList.contains('is-search-open')) return;
    if (e.target.closest('.catalog-toolbar__search')) return;
    setSearchOpen(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') setSearchOpen(false);
  });
}

let activeFilter = new URLSearchParams(location.search).get('category') || 'all';
if (!FILTER_COLORS[activeFilter] && activeFilter !== 'all') activeFilter = 'all';
let activeQuery = '';

function previewSrc(appId) {
  if (window.micrfun && window.micrfun.localizedPreviewUrl) {
    return window.micrfun.localizedPreviewUrl(appId);
  }
  return '/data/previews/' + appId + '.png?v=20260723';
}

function createCard(app) {
  const name = appText(app.id, 'name');
  const description = appText(app.id, 'description');
  const card = document.createElement('div');
  card.className = 'app-card';
  card.dataset.id = app.id;
  card.dataset.category = app.category;
  card.tabIndex = 0;
  card.setAttribute('role', 'link');
  const openLabel = window.micrfun
    ? window.micrfun.t('hub.open_app').replace('{name}', name)
    : name;
  card.setAttribute('aria-label', openLabel);

  card.innerHTML = `
    <div class="card-preview">
      <img src="${previewSrc(app.id)}" alt="Screenshot: ${name}" loading="lazy" data-app-id="${app.id}" onerror="handlePreviewFallback(this)">
      <span class="card-badge-overlay" style="background:${app.color}20;color:${app.color};border:1px solid ${app.color}40">${categoryLabel(app.category)}</span>
      <div class="card-title-overlay">${name}</div>
    </div>
    <div class="card-desc">${description}</div>
  `;

  const openCard = () => {
    window.location.href = app.url;
  };

  card.addEventListener('click', openCard);
  card.addEventListener('mouseenter', () => {
    if (window.__micrMascot) {
      window.__micrMascot.setContext({
        surface: 'hub-category',
        categoryId: app.category,
        appSlug: app.id
      });
    }
  });
  card.addEventListener('mouseleave', () => syncMascot());
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openCard();
    }
  });

  return card;
}

function handlePreviewFallback(image) {
  const appId = image.dataset.appId;
  if (!image.dataset.fallback && appId && window.micrfun && window.micrfun.defaultPreviewUrl) {
    image.dataset.fallback = '1';
    image.src = window.micrfun.defaultPreviewUrl(appId);
    return;
  }
  handlePreviewError(image);
}

function handlePreviewError(image) {
  image.onerror = null;
  const missingPreview = document.createElement('span');
  missingPreview.className = 'missing-preview';
  missingPreview.textContent = window.micrfun
    ? window.micrfun.t('hub.preview_missing')
    : 'Preview unavailable';
  image.replaceWith(missingPreview);
}

function syncMascot() {
  if (!window.__micrMascot) return;
  window.__micrMascot.setContext({
    surface: activeFilter === 'all' ? 'hub-home' : 'hub-category',
    categoryId: activeFilter === 'all' ? 'all' : activeFilter,
    appSlug: null
  });
}

function render() {
  filterBtns.forEach(btn => {
    const cat = btn.dataset.filter;
    btn.style.setProperty('--btn-color', FILTER_COLORS[cat] || '#3b82f6');
  });

  grid.innerHTML = '';
  let count = 0;

  for (const app of LEGACY_APPS) {
    const matchesFilter = activeFilter === 'all' || app.category === activeFilter;
    const q = activeQuery.toLowerCase();
    const matchesSearch = !q
      || appText(app.id, 'name').toLowerCase().includes(q)
      || appText(app.id, 'description').toLowerCase().includes(q);

    if (matchesFilter && matchesSearch) {
      grid.appendChild(createCard(app));
      count++;
    }
  }

  empty.style.display = count === 0 ? 'block' : 'none';
  syncMascot();
}

// Events
search.addEventListener('input', (e) => {
  activeQuery = e.target.value;
  render();
});

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

window.renderCatalog = render;
document.addEventListener('micrfun:ready', () => {
  filterBtns.forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.filter === activeFilter);
  });
  render();
});
document.addEventListener('langchange', () => render());

(function initMascot() {
  const host = document.querySelector('[data-micr-mascot]');
  if (!host || !window.MicrMascot) return;
  window.__micrMascot = MicrMascot.mountMascot(host, {
    surface: 'hub-home',
    categoryId: 'all'
  });
  const hubMascot = document.getElementById('hubMascotNav');
  if (hubMascot && window.__micrMascot) {
    hubMascot.addEventListener('mouseenter', () => window.__micrMascot.pulse());
  }
})();

}
</script>

  navigator.serviceWorker.register('/sw.js?v=20260904');
}
