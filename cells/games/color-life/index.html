<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цветная жизнь — micr.fun</title><link rel="icon" href="/favicon.svg">
<style>
:root{color-scheme:dark;--bg:#07090c;--panel:rgba(16,21,27,.78);--line:rgba(255,255,255,.12);--text:#f4f7f8;--muted:#87929d;--lime:#c6ff3d;--cyan:#63e6ff;--red:#ff5964;--green:#62ed9a;--blue:#6da8ff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 28%,rgba(198,255,61,.06),transparent 30%),linear-gradient(115deg,rgba(99,230,255,.035),transparent 40%)}button,input{font:inherit}.stage,canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.stage{isolation:isolate}.hud{position:fixed;z-index:2;left:clamp(12px,3vw,36px);right:clamp(12px,3vw,36px);top:clamp(12px,3vw,28px);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand,.state,.dock,.metricbar{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 18px 60px #0008}.brand{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;color:var(--text);text-decoration:none}.mark{width:10px;height:10px;border-radius:3px;background:var(--lime);box-shadow:0 0 18px var(--lime)}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.brand strong{display:block;font-size:15px;letter-spacing:-.02em}.state{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;color:var(--muted);font-size:12px}.state i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime)}.state.running i{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}.state.running{color:var(--text)}.dock{position:fixed;z-index:3;left:clamp(12px,3vw,36px);bottom:clamp(56px,8vh,92px);width:min(430px,calc(100vw - 24px));padding:14px;border-radius:20px}.dock-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.eyebrow{color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.dock-title{font-size:16px;font-weight:650}.actions{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px}.btn{min-height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;transition:.18s ease}.btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}.btn:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.btn.primary{border-color:transparent;background:var(--lime);color:#101509;font-weight:750}.btn.primary:hover{background:#ddff83}.control-row{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:12px}.control-row input{flex:1;accent-color:var(--lime)}output{min-width:30px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}.mini-actions{display:flex;gap:7px;margin-top:12px}.mini{min-height:34px;padding:0 10px;font-size:12px}.metricbar{position:fixed;z-index:2;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:0;border-radius:14px;overflow:hidden}.metric{min-width:100px;padding:8px 14px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric span{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.metric strong{font-size:16px;font-variant-numeric:tabular-nums}.hint{position:fixed;right:clamp(12px,3vw,36px);bottom:26px;color:var(--muted);font-size:11px}.hint kbd{padding:2px 5px;border:1px solid var(--line);border-radius:5px;color:var(--text)}@media(max-width:640px){.hud{align-items:flex-start}.state{padding:8px}.state span{display:none}.dock{left:8px;right:8px;bottom:8px;width:auto;padding:10px;border-radius:18px}.dock-head{margin-bottom:8px}.control-row{margin-top:8px}.mini-actions{margin-top:8px}.metricbar{left:8px;right:8px;bottom:calc(100% - 8px);transform:none;width:calc(100% - 16px);justify-content:space-between}.metric{min-width:0;flex:1;padding:7px 9px}.metric strong{font-size:14px}.hint{display:none}.brand{padding:8px 10px}.brand strong{font-size:14px}}
.mini[aria-pressed="true"]{border-color:rgba(198,255,61,.55);background:rgba(198,255,61,.12);color:var(--lime)}
</style>
</head>
<body>
<main class="stage"><canvas id="board" aria-label="Бесконечное поле цветной игры Жизнь"></canvas></main>
<header class="hud"><a class="brand" href="/"><i class="mark"></i><span><small>micr.fun / games</small><strong>Цветная жизнь</strong></span></a><div class="state" id="state"><i></i><span id="stateText">готово к запуску</span></div></header>
<section class="dock" aria-label="Управление симуляцией"><div class="dock-head"><span><span class="eyebrow">Эксперимент 01</span><span class="dock-title">Размножение цвета</span></span><span class="eyebrow" id="delta">—</span></div><div class="actions"><button class="btn primary" id="play" aria-label="Запустить симуляцию">▶ Запустить</button><button class="btn" id="step">Следующий шаг</button><button class="btn" id="reset">Новая колония</button></div><label class="control-row">скорость<input id="speed" type="range" min="1" max="20" value="8" aria-label="Скорость"><output id="speedOut">8×</output></label><div class="mini-actions"><button class="btn mini" id="brightness" aria-pressed="false" title="Поддерживать яркость смешанных цветов">☼ яркость</button><button class="btn mini" id="zoomOut">− масштаб</button><button class="btn mini" id="zoomReset">100%</button><button class="btn mini" id="zoomIn">＋ масштаб</button></div></section>
<div class="metricbar"><div class="metric"><span>поколение</span><strong id="generation">0</strong></div><div class="metric"><span>клетки</span><strong id="population">0</strong></div><div class="metric"><span>масштаб</span><strong id="zoomValue">100%</strong></div></div><div class="hint"><kbd>drag</kbd> поле · <kbd>wheel</kbd> масштаб · клик — клетка</div>
<script id="life-core">(function(){function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rgbToHsv(c){const[r,g,b]=c.map(v=>v/255),m=Math.max(r,g,b),n=Math.min(r,g,b),d=m-n;let h=0;if(d){if(m===r)h=((g-b)/d)%6;else if(m===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return{h,s:m?d/m:0,v:m}}function hsvToRgb(h,s,v){const c=v*s,x=c*(1-Math.abs(h/60%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}function compensateBrightness(rgb){const max=Math.max(...rgb);return max?rgb.map(v=>Math.round(v*255/max)):rgb}function mixColors(colors,brightnessCompensation=false){if(!colors.length)return{rgb:[128,128,128],hue:0,saturation:0,value:.5};const hsv=colors.map(rgbToHsv),sx=hsv.reduce((a,c)=>a+Math.cos(c.h*Math.PI/180)*Math.max(c.s,.35),0),sy=hsv.reduce((a,c)=>a+Math.sin(c.h*Math.PI/180)*Math.max(c.s,.35),0);let hue=Math.atan2(sy,sx)*180/Math.PI;if(hue<0)hue+=360;const saturation=clamp(Math.max(...hsv.map(c=>c.s))*.9+hsv.reduce((a,c)=>a+c.s,0)/hsv.length*.2,.76,1),value=clamp(Math.max(...hsv.map(c=>c.v))*.96+hsv.reduce((a,c)=>a+c.v,0)/hsv.length*.1,.7,.92),rgb=hsvToRgb(hue,saturation,value);return{rgb:brightnessCompensation?compensateBrightness(rgb):rgb,hue,saturation,value}}function worldKey(x,y){return x+','+y}function parseKey(k){return k.split(',').map(Number)}function cycleColor(current,palette){if(!current)return palette[0].slice();const index=palette.findIndex(color=>color.every((value,i)=>value===current[i]));return index===palette.length-1?null:palette[index+1].slice()}function stepSparse(cells,brightnessCompensation=false){const counts=new Map(),near=new Map();for(const k of cells.keys()){const[x,y]=parseKey(k);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy){const nk=worldKey(x+dx,y+dy);counts.set(nk,(counts.get(nk)||0)+1);if(!near.has(nk))near.set(nk,[]);near.get(nk).push(cells.get(k))}}const out=new Map();for(const[k,n]of counts)if(n===3||(n===2&&cells.has(k)))out.set(k,mixColors(near.get(k),brightnessCompensation).rgb);return out}function nextGeneration(grid){const h=grid.length,w=grid[0].length,out=Array.from({length:h},()=>Array(w).fill(0));for(let y=0;y<h;y++)for(let x=0;x<w;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if((dx||dy)&&grid[(y+dy+h)%h][(x+dx+w)%w])n++;out[y][x]=(grid[y][x]?(n===2||n===3):n===3)?1:0}return out}window.lifeGameCore={clamp,rgbToHsv,hsvToRgb,mixColors,compensateBrightness,cycleColor,averageColors:c=>c.length?c.reduce((a,v)=>a.map((x,i)=>x+v[i]),[0,0,0]).map(v=>Math.round(v/c.length)):[128,128,128],worldKey,parseKey,stepSparse,nextGeneration}})();</script>
<script>(function(){const original=window.lifeGameCore.stepSparse;window.lifeGameCore.stepSparse=(cells,brightnessCompensation)=>original(cells,brightnessCompensation===true);})();</script>
<script>(function(){const $=id=>document.getElementById(id),canvas=$("board"),ctx=canvas.getContext("2d"),core=window.lifeGameCore;let cells=new Map(),running=false,timer,generation=0,scale=22,camX=0,camY=0,dragging=false,last=[0,0],moved=false,brightnessCompensation=false;const palette=[[255,89,100],[98,237,154],[109,168,255]];function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}function world(x,y){return[Math.floor((x-innerWidth/2-camX)/scale),Math.floor((y-innerHeight/2-camY)/scale)]}function seed(){cells=new Map;for(let y=-10;y<10;y++)for(let x=-15;x<15;x++)if(Math.random()<.22)cells.set(core.worldKey(x,y),palette[Math.floor(Math.random()*3)]);generation=0;camX=camY=0;$('delta').textContent='nouvelle grille';draw()}function step(){const before=cells.size;cells=core.stepSparse(cells,brightnessCompensation);generation++;$('delta').textContent=(cells.size-before>=0?'+':'')+(cells.size-before)+' клеток';draw()}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);const left=Math.floor((-innerWidth/2-camX)/scale)-2,right=Math.ceil((innerWidth/2-camX)/scale)+2,top=Math.floor((-innerHeight/2-camY)/scale)-2,bottom=Math.ceil((innerHeight/2-camY)/scale)+2;ctx.save();ctx.translate(innerWidth/2+camX,innerHeight/2+camY);ctx.strokeStyle='rgba(255,255,255,.045)';ctx.lineWidth=1;for(let x=left;x<=right;x++){ctx.beginPath();ctx.moveTo(x*scale,top*scale);ctx.lineTo(x*scale,bottom*scale);ctx.stroke()}for(let y=top;y<=bottom;y++){ctx.beginPath();ctx.moveTo(left*scale,y*scale);ctx.lineTo(right*scale,y*scale);ctx.stroke()}ctx.strokeStyle='rgba(198,255,61,.2)';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.moveTo(0,-12);ctx.lineTo(0,12);ctx.stroke();for(const[k,c]of cells){const[x,y]=core.parseKey(k);if(x<left||x>right||y<top||y>bottom)continue;ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=Math.min(18,scale*.5);ctx.fillRect(x*scale+1,y*scale+1,Math.max(2,scale-2),Math.max(2,scale-2))}ctx.restore();$('generation').textContent=generation;$('population').textContent=cells.size;$('zoomValue').textContent=Math.round(scale/22*100)+'%'}function setRunning(value){running=value;$('state').classList.toggle('running',running);$('stateText').textContent=running?'симуляция идёт':'пауза';$('play').textContent=running?'Ⅱ Пауза':'▶ Запустить';clearInterval(timer);if(running)timer=setInterval(step,Math.max(40,1100/+$("speed").value))}function zoomAt(factor,x=innerWidth/2,y=innerHeight/2){const before=world(x,y);scale=core.clamp(scale*factor,6,88);const after=world(x,y);camX+=(after[0]-before[0])*scale;camY+=(after[1]-before[1])*scale;draw()}$('play').onclick=()=>setRunning(!running);$('step').onclick=()=>{setRunning(false);step()};$('reset').onclick=()=>{setRunning(false);seed()};$('brightness').onclick=()=>{brightnessCompensation=!brightnessCompensation;$("brightness").setAttribute('aria-pressed',String(brightnessCompensation));$("brightness").textContent=brightnessCompensation?'☼ яркость: on':'☼ яркость';};$('speed').oninput=e=>{$('speedOut').textContent=e.target.value+'×';if(running)setRunning(true)};$('zoomIn').onclick=()=>zoomAt(1.2);$('zoomOut').onclick=()=>zoomAt(.83);$('zoomReset').onclick=()=>{scale=22;camX=camY=0;draw()};canvas.onpointerdown=e=>{dragging=true;moved=false;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!dragging)return;const dx=e.clientX-last[0],dy=e.clientY-last[1];if(Math.abs(dx)+Math.abs(dy)>3)moved=true;camX+=dx;camY+=dy;last=[e.clientX,e.clientY];draw()};canvas.onpointerup=e=>{if(!moved){const[x,y]=world(e.clientX,e.clientY),k=core.worldKey(x,y);if(cells.has(k)){const next=core.cycleColor(cells.get(k),palette);if(next===null)cells.delete(k);else cells.set(k,next)}else cells.set(k,palette[0].slice());draw()}dragging=false};canvas.onwheel=e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)};addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setRunning(!running)}if(e.key.toLowerCase()==='n'){$('step').click()}});resize();seed()})()</script>
</body></html>
