<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>micr.fun</title>
<script>
(function () {
  var theme = localStorage.getItem('micrfun_theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="stylesheet" href="/data/styles/mascot.css">
<link rel="stylesheet" href="/data/styles/cross-nav.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0c0a; }
  .play-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
  }
</style>
</head>
<body data-micr-surface="mapmapmaps" data-hub-category="games">
<iframe class="play-frame" src="https://mapmapmaps.micr.fun/" title="MapMapMaps" allow="fullscreen"></iframe>
<div id="micr-cross-nav-root"></div>
<script src="/data/js/i18n-core.js"></script>
<script src="/data/js/mascot.js"></script>
<script src="/data/js/pwa-install.js"></script>
<script src="/data/js/cross-nav.js"></script>
</body>
</html>
